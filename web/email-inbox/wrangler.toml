# SCLM 메일 수신 워커 — 전달한 메일을 할 일로 만든다.
#
# 사전 준비 (도메인이 있어야 한다):
#   1) 도메인을 Cloudflare 에 등록(네임서버 변경)
#   2) 대시보드 → Email → Email Routing 활성화 (MX·SPF 레코드 자동 추가)
#   3) 이 워커 배포:  cd web/email-inbox && npm install && npx wrangler deploy
#      ⚠️ `npm install` 을 빼먹지 말 것. 이 워커는 별도 패키지라 자체 node_modules
#         가 필요하다(부모의 web/node_modules 로는 postal-mime 이 안 잡힌다).
#         빼먹으면 `Could not resolve "postal-mime"` 로 **빌드가 조용히 실패**하고,
#         증상은 엉뚱하게 "시크릿이 안 들어간다"로 나타난다(배포가 안 됐으니
#         옛 var 바인딩이 그대로 남아 10053 이 뜬다). 2026-08-06 실제로 겪음.
#   4) 시크릿 등록:   npx wrangler secret put MAIL_INBOX_SECRET  (Pages 쪽과 **같은 값**)
#      ⚠️ 크론의 CRON_SECRET 과는 **다른 값**이다. 같이 쓰면 값을 바꿀 때 네 곳을
#         동시에 맞춰야 하고 하나만 빠져도 아침 알림이 멈춘다.
#      선택:          npx wrangler secret put FALLBACK_TO       (아래 설명 참고)
#   5) Email Routing → Routes → Custom address 를 만들고 Action=Send to a Worker
#      → 이 워커 선택
#
# ⚠️ 주소는 **추측하기 어렵게** 지을 것 (예: todo-9f3k2@내도메인). 메일 주소는
#    세상 누구나 보낼 수 있고, 발신자 확인(Pages 의 MAIL_ALLOW_FROM)이 뚫리면
#    남이 내 할 일 목록에 글을 넣게 된다. 주소 자체가 1차 방어선이다.
name = "sclm-email-inbox"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[vars]
TARGET_URL = "https://sclm.pages.dev/api/mail-inbox"

# FALLBACK_TO — 서버에 못 닿았을 때 메일을 잃지 않도록 넘길 주소(본인 메일함).
#   비워 두면 반송된다. 반송도 "조용히 사라지는 것"보단 낫지만, 넣어 두면 전달한
#   메일이 그대로 메일함으로 되돌아오므로 손으로 다시 옮길 수 있다.
# ⚠️ 여기 **적지 말고 시크릿으로 등록할 것**:  npx wrangler secret put FALLBACK_TO
#    이 저장소는 공개다. vars 에 적으면 메일 주소가 그대로 공개된다.
#    (같은 이름을 vars 에도 두면 충돌한다 — 그래서 선언 자체를 두지 않는다)
# ⚠️ **배포가 먼저다.** 배포된 워커에 같은 이름의 var 가 남아 있으면 시크릿 등록이
#    `Binding name 'FALLBACK_TO' already in use [code: 10053]` 로 거부된다.
#    wrangler.toml 을 고쳐도 배포 전까지는 옛 바인딩이 살아 있기 때문이다.
#    순서:  npx wrangler deploy  →  npx wrangler secret put FALLBACK_TO
# ⚠️ Email Routing 에서 **검증된 주소**여야 forward 가 동작한다.
