# 아침 알림 — **수동 예비용**. 정기 발송은 Cloudflare Worker(sclm-push-cron)가 한다.
#
# 🛑 2026-07-30 정기 스케줄 해제. 이틀 연속 9시간 지각해 백업 역할도 못 했다.
#    | 날짜  | cf-cron            | gh-actions (예정 07:57·08:12 KST) |
#    |-------|--------------------|-----------------------------------|
#    | 07-29 | 08:00:16 발송      | 17:11 (9h14m 지각)                |
#    | 07-30 | 08:00:16 발송      | 16:56 (9h 지각)                   |
#    GitHub 무료 러너의 schedule 은 큐가 밀리면 몇 시간씩 늦는다. 저녁에 오는
#    아침 브리핑은 의미가 없어서 정기 실행을 껐다. (근거: D1 'daily' 문서의 attempts)
#
# 언제 쓰나 — 아침에 알림이 안 왔을 때 **Actions 탭에서 [Run workflow]** 로 즉시 발송.
#    run-daily 의 하루 1회 가드가 있어 이미 발송된 날 눌러도 중복 발송되지 않는다.
# 되살리려면 — 아래 schedule 주석을 풀면 된다(지연 문제는 그대로일 가능성이 높다).
#
# 필요한 저장소 시크릿: CRON_SECRET (Cloudflare Pages의 CRON_SECRET과 같은 값)
#   등록: GitHub 저장소 → Settings → Secrets and variables → Actions → New repository secret

name: daily-alarm

on:
  # schedule:
  #   - cron: '57 22 * * *'   # 07:57 KST — 2026-07-30 해제(9시간 지각)
  #   - cron: '12 23 * * *'   # 08:12 KST — 위와 같음
  workflow_dispatch: {}   # 수동 실행 전용

jobs:
  alarm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # ⚠️ 캘린더를 먼저 맞춘다 — 브리핑이 오늘 일정을 읽기 때문.
      #    동기화가 실패해도 브리핑은 나가야 하므로 continue-on-error.
      - name: calendar sync (구글 캘린더 동기화, truncated 시 최대 3회)
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/cal.json -w "%{http_code}" -X POST \
              -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
              -H "X-Cron-Source: gh-actions" \
              https://sclm.pages.dev/api/google/sync)
            echo "try $i: HTTP $code"
            cat /tmp/cal.json
            grep -q '"truncated":true' /tmp/cal.json || break
          done

      - name: run-daily (아침 브리핑 — 할 일 + 오늘 일정, 카카오·푸시 발송)
        run: |
          code=$(curl -s -o /tmp/daily.json -w "%{http_code}" -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "X-Cron-Source: gh-actions" \
            https://sclm.pages.dev/api/push/run-daily)
          echo "HTTP $code"
          cat /tmp/daily.json
          [ "$code" = "200" ] || exit 1
