# 매일 아침 알림 스케줄러 (이중화 중 하나)
# Cloudflare Worker(sclm-push-cron, 08:00·08:10 KST)와 함께 같은 엔드포인트를 호출한다.
# run-daily 의 하루 1회 가드가 중복 발송을 막으므로 알림은 하루 한 번만 간다.
# 어느 쪽이 실제로 발사됐는지는 X-Cron-Source 로 D1의 'daily' 문서에 기록된다.
#
# ⚠️ 2026-07-29 실측: 이 워크플로가 예정(22:57·23:12 UTC)보다 9시간 넘게 지연돼
#    08:11 UTC에 몰려 실행됐다. 같은 날 Cloudflare 크론은 23:00:16 UTC 정시 발사.
#    GitHub 스케줄은 지연이 잦으니 이 워크플로만 믿지 말 것.
#
# 필요한 저장소 시크릿: CRON_SECRET (Cloudflare Pages의 CRON_SECRET과 같은 값)
#   등록: GitHub 저장소 → Settings → Secrets and variables → Actions → New repository secret
#   또는: gh secret set CRON_SECRET

name: daily-alarm

on:
  schedule:
    # GitHub 크론은 UTC. 정각은 혼잡해 지연이 잦으므로 :57을 사용 → 07:57 KST 본발사, 08:12 KST 재시도
    - cron: '57 22 * * *'
    - cron: '12 23 * * *'
  workflow_dispatch: {}   # 수동 실행(테스트)용

jobs:
  alarm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: run-daily (시트 동기화 + 카카오·푸시 발송)
        run: |
          code=$(curl -s -o /tmp/daily.json -w "%{http_code}" -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "X-Cron-Source: gh-actions" \
            https://sclm.pages.dev/api/push/run-daily)
          echo "HTTP $code"
          cat /tmp/daily.json
          [ "$code" = "200" ] || exit 1

      - name: calendar sync (구글 캘린더 동기화, truncated 시 최대 3회)
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/cal.json -w "%{http_code}" -X POST \
              -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "X-Cron-Source: gh-actions" \
              https://sclm.pages.dev/api/google/sync)
            echo "try $i: HTTP $code"
            cat /tmp/cal.json
            grep -q '"truncated":true' /tmp/cal.json || break
          done
